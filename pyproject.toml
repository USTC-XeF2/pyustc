[project]
name = "pyustc"
version = "1.2.0"
description = "A Python package that allows for quick use of USTC network services"
readme = "README.md"
authors = [
    { name = "XeF2", email = "contact@xef2.top" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pycryptodome>=3.23.0,<4",
    "ua-generator>=2.1.4,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://github.com/USTC-XeF2/pyustc"
Issues = "https://github.com/USTC-XeF2/pyustc/issues"

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "TID",
    "UP",
    "B",
    "PLE",
    "PLW",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "PTH",
    "PERF",
    "ASYNC",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true
